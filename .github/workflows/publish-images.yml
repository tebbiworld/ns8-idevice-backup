name: "Publish images"

on:
  push:
  workflow_dispatch:

permissions:
  pull-requests: write
  packages: write
  actions: read
  contents: write
  security-events: write

jobs:
  publish-images:
    if: github.run_number > 1
    uses: NethServer/ns8-github-actions/.github/workflows/publish-branch.yml@v1
  module:
    needs: publish-images
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@v1
  trivy:
    needs: module

    if: ${{ needs.module.outputs.release == 'stable' || needs.module.outputs.release == 'latest' || github.event_name == 'workflow_dispatch' }}
    uses: NethServer/ns8-github-actions/.github/workflows/scan-with-trivy.yml@v1
    with:
      images: ${{ needs.module.outputs.images }}
  test:
    name: "Test on QEMU"
    # Real NS8 nodes (Rocky 9 and Debian 13) on the GitHub runner, through
    # stephdl/ns8-ci-actions: clean install, update from the last release, backup
    # and restore (see tests/). Feature branches only: main and release tags
    # publish commits that were already tested on their branch, so testing them
    # again would only burn runner jobs. Run it by hand with workflow_dispatch.
    needs: publish-images
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
    permissions:
      contents: read
      pull-requests: write
    uses: stephdl/ns8-ci-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      # tests/10__install.robot branches on $SCENARIO
      scenarios: '["install","update"]'
      ui_tests_strategy: never
