#
# Restic include patterns for the iOS backup module (paths relative to /srv).
# The critical, small state is the pairing records (losing them means re-pairing
# every device) and the device registry. The backups themselves live in the
# idevice-data volume and are intentionally NOT included here: they can be large
# and are the module's own product. Add "volumes/idevice-data" below if you want
# the NS8 backup to also carry the device backups (doubles the storage).
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
state/environment
state/devices.json
volumes/idevice-lockdown
